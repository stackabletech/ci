[package]
name = "harbor-sbom-browser"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["erased-json"] }
base64 = "0.23.1"
futures = "0.3.30"
lazy_static = "1.4.0"
regex = "1.10.3"
reqwest = { version = "0.13.5", features = ["json", "rustls"], default-features = false }
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.113"
snafu = "0.9.2"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.36.0", features = ["macros", "process", "rt-multi-thread"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
urlencoding = "2.1.3"

[dev-dependencies]
rstest = "0.27.0"
