---
role: Aggregator
customConfig:
  api:
    address: 0.0.0.0:8686
    enabled: true
  sources:
    vector:
      address: 0.0.0.0:6000
      type: vector
      version: "2"
  transforms:
    # Some products yield empty log lines which we do not want in our system
    drop_void_records:
      type: filter
      inputs:
        - vector
      condition: 
        type: vrl
        source: ".level != null || .logger != null || .message != null"
    enriched_logs:
      type: remap
      inputs: 
        - drop_void_records
      source: |-
        .t2_cluster = get_env_var!("T2_CLUSTER_ID")
  sinks:
    opensearch_out:
      type: elasticsearch
      inputs:
        - enriched_logs
      # v7 suppresses the doc type, which OpenSearch no longer accepts.
      api_version: v7
      endpoints:
        - "${OPENSEARCH_ENDPOINT}"
      mode: bulk
      bulk:
        action: index
        index: t2-product-%F
      tls:
        verify_certificate: false
        verify_hostname: false 
      auth:
        strategy: basic
        user: "${OPENSEARCH_USERNAME}"
        password: "${OPENSEARCH_PASSWORD}"
envFrom:
  - configMapRef:
      name: cluster-metadata 
env:
  # Vector 0.57 disabled the interpolation of environment variables in the
  # configuration by default. The configuration above relies on it, so it must
  # be enabled again.
  - name: VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION
    value: "true"
  - name: OPENSEARCH_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: cluster-logging-target
        key: endpoint
  - name: OPENSEARCH_USERNAME
    valueFrom:
      secretKeyRef:
        name: cluster-logging-target
        key: user
  - name: OPENSEARCH_PASSWORD
    valueFrom:
      secretKeyRef:
        name: cluster-logging-target
        key: password
